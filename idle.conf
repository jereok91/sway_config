# Tiempos de inactividad (en MINUTOS). Pon 0 para desactivar ese paso.
# Tras editar, aplica los cambios con:
#   systemctl --user restart swayidle

# Bajar brillo (requiere brightnessctl)
DIM_MINUTES=1

# Bloquear pantalla
LOCK_MINUTES=2

# Apagar monitores
SCREEN_OFF_MINUTES=5

# Suspender el PC
SUSPEND_MINUTES=30
